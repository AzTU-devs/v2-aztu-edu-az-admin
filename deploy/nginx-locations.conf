# Merge with the existing server's location rules; do not create duplicate / blocks.
location ~ /\.(?!well-known/) { return 404; }
location = /robots.txt {
    default_type text/plain;
    return 200 "User-agent: *\nDisallow: /\n";
}
# The existing SPA location should continue serving index.html for application
# routes; explicitly denied dotfiles above must not fall back to that shell.
