# Include inside the existing HTTPS server block for admin.aztu.edu.az.
# Repeat/include these in any nested location which sets its own add_header.
server_tokens off;
client_max_body_size 25m;
client_body_timeout 15s;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
add_header Cache-Control "no-store" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://api.aztu.edu.az; img-src 'self' data: blob: https://api.aztu.edu.az https://aztu.edu.az https://www.aztu.edu.az; font-src 'self' data:; frame-src https://api.aztu.edu.az; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
